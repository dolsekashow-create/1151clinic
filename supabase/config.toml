# إعدادات Supabase المحلية
# القيم هنا للتطوير المحلي فقط — لا تحتوي أي أسرار إنتاج.

project_id = "erp-multi-branch"

[api]
enabled = true
port = 54321
# ⚠️ `public` فقط. مخططات app/audit/integration غير مكشوفة عبر PostgREST عمدًا:
#    دوال الأمان يجب ألا تكون قابلة للاستدعاء من العميل.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# التسجيل الذاتي معطّل: المستخدمون يُنشأون من الإدارة فقط (راجع Q-06)
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = false   # لا تُفعَّل بلا حالة استخدام مؤكدة — راجع ARCHITECTURE.md §9

[inbucket]
enabled = true
port = 54324
